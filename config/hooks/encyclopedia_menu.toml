# Camp Encyclopedia integration (bodies in src/engine/menus/encyclopedia_menu.cpp).
# The engine spells this menu 'dia' / Diary; the English release calls it the
# Encyclopedia.
#
# The first two hooks below hand a destination state in r4 to
# CampDiary__SetState, the state transition every stock entry and cancel chain
# already uses. That lets the guest run its own Exit(old) / Enter(new) pair
# instead of us emulating them, so the screen array at task+0x7C is hidden and
# reshown natively. They enter it at different addresses because each one is
# followed by the sound cue for its own direction, and the viewer must not
# sound the other's.

# Sixth entry dispatch. AnimeMenu_getCurrentEntryId leaves the entry id in r3 at
# 0x822F76D8. Stock maps entries 0..4 to states 2, 3, 4, 7 and 0xB. Ours takes
# state 0x14, which is past the last case of all three switches (dispatch bails
# above 0x13, Exit above 0x13, Enter above 0x12), so only our hook drives it.
# 0x822F7720 is 'mr r3, r31; bl CampDiary__SetState', and the confirm cue at
# 0x822F7728 ('li r3, 0') falls out of it - the same pair the five stock
# entries run.
[[midasm_hook]]
address = 0x822F76F4
name = "bdEncyclopediaAchievementsDispatchHook"
registers = ["r3", "r4"]
after_instruction = false
jump_address_on_true = 0x822F7720

# Drives the viewer while state 0x14 is current. Placed after 'mr r31, r3'
# (0x822F766C) so the task pointer is live, and ahead of the state load so the
# guest's own 'bgt' past 0x13 reaches the epilogue for us on ordinary frames.
# Returns true only to close, with r4 = 1 for the transition back to the top
# menu. 0x822F7EE8 is the tail of the guest's own state 0x13 case -
# 'mr r3, r31; bl CampDiary__SetState' straight into the epilogue, the one
# entry to it that sounds nothing. The entry chain's 0x822F7720 would have
# played the confirm cue on the way out, a fifth of a second after the cancel
# cue the viewer sounds on the press.
[[midasm_hook]]
address = 0x822F7670
name = "bdEncyclopediaAchievementsUpdateHook"
registers = ["r31", "r4"]
after_instruction = false
jump_address_on_true = 0x822F7EE8

# Sixth row of the Encyclopedia pane the Items screen shows while its own cursor
# is still in the category column. That pane lives inside L_itm_cate.csv, which
# bdCampItemLoad (0x822DF550) puts at itemTask+0x84+4*1, gated on its DiaryAlpha
# variable - not M_itm_dia.csv and not the camp main task's M_top_dia.csv, both
# of which stay hidden on this route.
# Placed after 'mr r31, r3' (0x822DFA24) in Camp__Item__MainTask__vf02 and ahead
# of the state load, so the item task is live and it runs every frame.
[[midasm_hook]]
address = 0x822DFA28
name = "bdCampEncyclopediaPreviewHook"
registers = ["r31"]
after_instruction = false
