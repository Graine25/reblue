# Movie and event scene playback tracking (bodies in
# src/engine/cutscene.cpp).

# SFD movie playback, which suspends the FPS unlock while a movie plays.
[[midasm_hook]]
address = 0x8212FB6C
name = "bdMoviePlaybackHook"
registers = ["r31"]
after_instruction = false

# bdEventSceneCreate, after the id load at 0x823F5B2C and before BD's own
# current event store, which is gated on id % 100 == 0 and so misses every
# _evt_NN sub scene. r30 = the new issEvent, r11 = its id, r31 = the basename.
[[midasm_hook]]
address = 0x823F5B30
name = "bdEventSceneCreatedHook"
registers = ["r30", "r11", "r31"]
after_instruction = false

# issEvent destructor, at BD's matching clear. r31 = the dying task.
[[midasm_hook]]
address = 0x823F5D9C
name = "bdEventSceneDestroyedHook"
registers = ["r31"]
after_instruction = false

# Loader::vf03, on the lfs of the loading icon fade (this+0x84) that feeds the
# show/hide test two instructions down. Before it, so the branch reads what the
# hook leaves. r31 = the Loader.
[[midasm_hook]]
address = 0x82129660
name = "bdLoaderIconMovieHideHook"
registers = ["r31"]
after_instruction = false
