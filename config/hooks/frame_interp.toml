# Frame interpolation and 30Hz gates (bodies in src/engine/frame_interp.cpp).
# Active when bd_fps_limit > 30 or unlimited: each gate skips one fixed-step
# accumulator store on interpolated frames, and the draws that follow re-read the
# unchanged value.

# Logic tick.
[[midasm_hook]]
address = 0x82126B78
name = "bdLogicTickGateHook"
registers = ["r28"]
after_instruction = false
jump_address_on_true = 0x82126C20

# Master 30Hz animation clock dword_82DC99C4 in bdFrameSubmit: skip its addi
# (jump goes to the stw, rewriting the unchanged counter).
[[midasm_hook]]
address = 0x82134DB4
name = "bdFrameClockGateHook"
registers = []
after_instruction = false
jump_address_on_true = 0x82134DB8

