# Disc and file I/O (bodies in src/vfs/disc_io.cpp).

# Multi-DVD removal: skip storing the detected disc number (stw r31, 0x174(r3)).
# Leaves file manager disc = 0 so all disc change checks see "no disc" and skip.
[[midasm_hook]]
address = 0x820CEAA8
name = "bdSkipDiscNumberStore"
registers = []
after_instruction = false
jump_address_on_true = 0x820CEAAC

# Zero-length read guard: before bl ReadFile in bdIOThreadReadFile (r5 = size);
# on a 0-size request jump to the success continuation at 0x82271AEC.
[[midasm_hook]]
address = 0x82271AE0
name = "bdZeroLengthReadGuard"
registers = ["r5", "r31"]
after_instruction = false
jump_address_on_true = 0x82271AEC
