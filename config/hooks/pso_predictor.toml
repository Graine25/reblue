# Load-time PSO predictor and gate (bodies in src/gpu/pipeline/pso_predictor.cpp).
# Bracket bdSceneGraphBuild inside the async model load callback so a model's PSOs
# compile before it reports ready.

# A: begin load capture, before bl bdSceneGraphBuild; r30 = the LoadModel asset
# being built (predictor key only, never dereferenced).
[[midasm_hook]]
address = 0x8217B9F8
name = "bdModelLoadBeginHook"
registers = ["r30"]
after_instruction = false

# B: gate, right after bdSceneGraphBuild returns (before `stw r3,0xCC(r30)` at
# 0x8217B9FC). Blocks until the model's PSOs are warm (watchdog-bounded).
[[midasm_hook]]
address = 0x8217B9FC
name = "bdModelLoadEndHook"
registers = []
after_instruction = false

# C: per-VA predictor, after bl hcgVertexDeclarationRegist; r3 = decl slot, r31 = per-vertex stride.
[[midasm_hook]]
address = 0x8227E4B4
name = "bdSceneGraphPredictDeclHook"
registers = ["r3", "r31"]
after_instruction = false

# Asset map: after bl bdLoadModelFindOrCreate returns in bdBinaryModelLoadRequest.
# r3 = shared name-keyed LoadModel asset, r31 = requesting VisualObject.
[[midasm_hook]]
address = 0x8214023C
name = "bdModelLoadAssetMapHook"
registers = ["r3", "r31"]
after_instruction = false

# Technique read at bdBinaryModelLoadRequest entry (r3 = VisualObject; +0xBB8 already
# assigned). Hook A's `this` is ambiguous across LH_Model sub-slots, so read here.
[[midasm_hook]]
address = 0x82140178
name = "bdModelLoadRequestTechHook"
registers = ["r3"]
after_instruction = false

# Late technique writers: these types store VisualObject+0xBB8 after the load request;
# hook each stw after the store and re-predict from the fresh value.
[[midasm_hook]]            # mcl::cloud_object::vf04
address = 0x82453A74
name = "bdTechAssignCloudHook"
registers = ["r31"]
after_instruction = true

[[midasm_hook]]            # mcl__water_object__vf04_body
address = 0x8245438C
name = "bdTechAssignWaterHook"
registers = ["r31"]
after_instruction = true

[[midasm_hook]]            # mcl__caustics_object__SetupEffectBuffers
address = 0x82455568
name = "bdTechAssignEffectHook"
registers = ["r31"]
after_instruction = true

[[midasm_hook]]            # mcl::ssscattering_object::vf04
address = 0x824559DC
name = "bdTechAssignSssHook"
registers = ["r31"]
after_instruction = true

[[midasm_hook]]            # mcl::frescowall_object::vf04
address = 0x82455C54
name = "bdTechAssignFrescoHook"
registers = ["r3"]
after_instruction = true

[[midasm_hook]]            # Gmk__parseMclObjects site 1 (waterfall/caustics family)
address = 0x82457264
name = "bdTechAssignWaterfallHook"
registers = ["r31"]
after_instruction = true

[[midasm_hook]]            # Gmk__parseMclObjects site 2
address = 0x82457B78
name = "bdTechAssignWaterfallBHook"
registers = ["r25"]
after_instruction = true

[[midasm_hook]]            # bdMdlTextFileParse: tech from .mdl text key
address = 0x82294DC0
name = "bdTechAssignMdlTextHook"
registers = ["r25"]
after_instruction = true

[[midasm_hook]]            # bdMdlTextFileParse: mirror (tech 11) from text
address = 0x82294F4C
name = "bdTechAssignMdlMirrorHook"
registers = ["r25"]
after_instruction = true

[[midasm_hook]]            # bdVisualObjectSetWindParams: forces tech 3 (wind)
address = 0x82143B50
name = "bdTechAssignWindHook"
registers = ["r29"]
after_instruction = true
