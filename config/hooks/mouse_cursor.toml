# The pointer sprite joins the same 2D pass the item drop label replays into:
# the instruction before bdFrameSubmit's bdPrimFlush call, which is where a prim
# still arrives ahead of the Visual::Tag pool slot flip. Anchored to the call
# before it rather than to bdPrimFlush's own, which frame_interp.toml already
# holds, and runs per rendered frame rather than per 30Hz tick so the cursor
# tracks the mouse instead of stepping behind it.
[[midasm_hook]]
address = 0x82134140
name = "bdMouseCursorDrawHook"
registers = []
after_instruction = true
