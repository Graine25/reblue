# Idle fade for the field HUD (bodies in src/engine/hud_fade.cpp). Each hook
# scales the alpha of a color a HUD element was about to draw with.

# CompassTask::vf03: r30 is -1 or the blink ramp, both paths merged by the next
# instruction, and all three compass draws read it.
[[midasm_hook]]
address = 0x8239CC84
name = "bdCompassFadeHook"
registers = ["r30"]
after_instruction = true

# MiniMapTask's disc frame and player arrow. After the copy into the layer call's
# argument area, not on the build above it, or the layer scales twice.
[[midasm_hook]]
address = 0x8239B080
name = "bdMiniMapWidgetFadeHook"
registers = ["r27"]
after_instruction = true

# The objective marker, already ramped by distance to the target.
[[midasm_hook]]
address = 0x8239B530
name = "bdMiniMapMarkerFadeHook"
registers = ["r30"]
after_instruction = true

# The two-uv vertex pusher, reached only from the minimap's map layer and the
# widget's quad.
[[midasm_hook]]
address = 0x821494EC
name = "bdMiniMapLayerFadeHook"
registers = ["r31"]
after_instruction = true

# StatusIconTex::DrawIcon, after the blink alpha is inserted into the vertex
# color and before it is stored to the draw's argument area.
[[midasm_hook]]
address = 0x824334F4
name = "bdStatusAilmentIconFadeHook"
registers = ["r8"]
after_instruction = true

# SimpleStatusTask::vf02, where the field row walk and the branch that skips it
# meet. The body writes a d2anime variable, which runs guest code over the
# volatile registers, so it sits where only the task in r29 is live.
[[midasm_hook]]
address = 0x823714C4
name = "bdPartyCardFadeHook"
registers = ["r29"]
after_instruction = false
