# Battle lifecycle (bodies in src/engine/battle.cpp).

# BattleCameraTask's destructor, at the merge point past its own free of
# this+0x9C. That clear of the global Battle::IsActive() answers from is the only
# one in the title, so it is the battle exit edge. Placed here rather than on the
# store itself because the store sits inside the free's argument window, where a
# subscriber running guest code would corrupt the pointer being freed.
[[midasm_hook]]
address = 0x8225432C
name = "bdBattleCameraDestroyHook"
registers = []
after_instruction = false

# Enemy spawn, at the tail append that links a fully constructed EneTask into its
# EnePtyTask. Every spawn path funnels through this one store, and neither the
# helper nor EneTask__ctor is a named function, so the edge is only reachable
# mid-asm. r3 = the new node, 0 when the allocation failed.
[[midasm_hook]]
address = 0x82201EE4
name = "bdEnemySpawnLinkHook"
registers = ["r3"]
after_instruction = true
