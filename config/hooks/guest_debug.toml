# Guest config and debug input (bodies in src/engine/guest_debug.cpp).

# Fires after bdGameSettingsInit writes defaults; registers cvar callbacks.
[[midasm_hook]]
address = 0x820CE730
name = "bdPostConfigInitHook"
registers = []
after_instruction = true

# Per-frame keyboard bridge for debug input.
[[midasm_hook]]
address = 0x82126B04
name = "bdKeyboardPollHook"
registers = []
after_instruction = false
