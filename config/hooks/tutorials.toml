# Tutorial suppression (bodies in src/engine/tutorials.cpp).

# Script opcode 5053 (show an SCA page) case entry in bdScriptExecute. On true
# the handler is skipped with r3 = 0, which the shared tail reads as "advance
# the program counter and keep running this frame".
[[midasm_hook]]
address = 0x821AE48C
name = "bdScriptScaSkipHook"
registers = ["r3", "r31"]
after_instruction = false
jump_address_on_true = 0x821ADDA4

# Script__vf02 forces the Equipping Skills tutorial on its own, outside the
# script. It reads its state before arming and any nonzero value skips the
# trigger, so hand it the finished sentinel the engine writes itself.
[[midasm_hook]]
address = 0x821AA9E4
name = "bdScriptSkillTutorialSkipHook"
registers = ["r11"]
after_instruction = false
