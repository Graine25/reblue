# Physical buffer registration (bodies in src/gpu/physical_buffers.cpp,
# except bdPreloadTableFreeTextureHook in src/gpu/native_texture_mirror.cpp).

# Geometry block: fires after bdSceneGraphBuild stores the XPhysicalAllocEx base to
# obj+0x18 (0x8227E89C), before mesh bump allocation at 0x8227E8B4; r31 = scene graph
# object.
[[midasm_hook]]
address = 0x8227E8A0
name = "bdSceneGraphBuildHook"
registers = ["r31"]
after_instruction = false

# IB/VB registration: each fires at its bl XGOffsetResourceAddress with struct VA,
# base and size live (RegisterPhysicalBufferOnce).
# IB (0x8227E248): r3=pResource, r4=pBaseAddress, r30=size (slwi at 0x8227e20c).
[[midasm_hook]]
address = 0x8227E248
name = "bdSceneGraphRegisterIBHook"
registers = ["r3", "r4", "r30"]
after_instruction = false

# VB (0x8227E540): r3=pResource, r4=pBaseAddress, r31=size (mullw at 0x8227e4f4).
[[midasm_hook]]
address = 0x8227E540
name = "bdSceneGraphRegisterVBHook"
registers = ["r3", "r4", "r31"]
after_instruction = false

# Block free: bdSceneGraphDestroy's bl XPhysicalFree (reached only when obj+0x18 != 0);
# evict every host mirror in [r3, r3+size).
[[midasm_hook]]
address = 0x8227EC14
name = "bdSceneGraphDestroyHook"
registers = ["r3", "r31"]
after_instruction = false

# Native texture mirror, preload table refcount-zero free route
# (hcgTextureListRelease). r25 = mirror key, r26 = XPhysical marker.
[[midasm_hook]]
address = 0x8228522C
name = "bdPreloadTableFreeTextureHook"
registers = ["r25", "r26"]
after_instruction = false
