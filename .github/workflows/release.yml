name: Release

# Push a v* tag and it builds Windows and Linux, then publishes the tag as a
# release. A tag with a suffix (v0.5.0-rc1) publishes as a prerelease.
# workflow_dispatch builds the same jobs without publishing.
#
# macOS is off, here and in the nightly. _build-macos.yml stays put: turning it
# back on is this job block and one entry in publish's needs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "rexglue-sdk release: latest-nightly, latest-stable, or an explicit tag"
        required: false
        type: string
        default: latest-nightly

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    uses: ./.github/workflows/_resolve.yml
    with:
      sdk_ref: ${{ inputs.sdk_ref || 'latest-nightly' }}
    secrets: inherit

  verify:
    needs: resolve
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Match the tag against the project version
        id: tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          case "${TAG}" in
            "v${VERSION}")   echo "prerelease=false" >> "${GITHUB_OUTPUT}" ;;
            "v${VERSION}-"*) echo "prerelease=true"  >> "${GITHUB_OUTPUT}" ;;
            *)
              echo "::error::tag ${TAG} does not match project version ${VERSION}; expected v${VERSION} or v${VERSION}-<suffix>"
              exit 1
              ;;
          esac

  windows:
    needs: [resolve, verify]
    uses: ./.github/workflows/_build-windows.yml
    with:
      sdk_tag: ${{ needs.resolve.outputs.sdk_tag }}
      asset_base: ${{ needs.resolve.outputs.asset_base }}
      update_channel: ${{ needs.verify.outputs.prerelease == 'true' && 'nightly' || 'stable' }}
    secrets: inherit

  linux:
    needs: [resolve, verify]
    uses: ./.github/workflows/_build-linux.yml
    with:
      sdk_tag: ${{ needs.resolve.outputs.sdk_tag }}
      asset_base: ${{ needs.resolve.outputs.asset_base }}
      update_channel: ${{ needs.verify.outputs.prerelease == 'true' && 'nightly' || 'stable' }}
    secrets: inherit

  publish:
    needs: [resolve, verify, windows, linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: reblue-*
          path: artifacts
          merge-multiple: true

      # Not into artifacts/: that is what the manifest names and what goes to
      # the CDN. Symbols only attach to the release.
      - name: Download symbols
        uses: actions/download-artifact@v8
        with:
          pattern: symbols-*
          path: symbols
          merge-multiple: true

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/compose-release-notes.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: reblue v${{ needs.resolve.outputs.version }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          body_path: notes.md
          files: |
            artifacts/*
            symbols/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate manifest
        run: |
          python3 tools/gen_manifest.py \
            "${{ needs.resolve.outputs.version }}" \
            artifacts \
            "${{ vars.UPDATE_BASE_URL }}/app/v${{ needs.resolve.outputs.version }}" \
            "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
            manifest.toml \
            --content-url "${{ vars.UPDATE_BASE_URL }}/manifest/content.toml"

      - name: Publish to R2
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash .github/scripts/publish-r2.sh
