# BattleViewTask::vf03 calls the previewed Chara's own Update (vtable+0xC,
# Player__Update_vf03: bdAnimationUpdate, CharaVO__InvalidateAndSimulate, head
# tracking) directly, once per rendered frame, then its Draw (vtable+0x10). All
# of it is fixed-step, so above 30fps the model animates and simulates at
# fps/30 speed. Gate the Update bctrl only; Draw keeps running every frame and
# the following block reloads r11 and r3 from r31.
[[midasm_hook]]
address = 0x823E9388
name = "bdShaderAnimGateHook"
registers = []
after_instruction = false
jump_address_on_true = 0x823E938C

# BattleViewTask::vf03 (0x823E8F78) tail: the tool's own frame counter
# (this+0x10C) += 1 per rendered frame, calibrated for 30Hz. It drives the
# cursor tile size pulse (sin(n/30 * pi)) and the prompt text alpha blink
# (sin(n/60 * pi)), so above 30fps both strobe. Skips the stfs only.
[[midasm_hook]]
address = 0x823E9764
name = "bdShaderAnimGateHook"
registers = []
after_instruction = false
jump_address_on_true = 0x823E9768

