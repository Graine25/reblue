name: Dev nightly CI

# Builds the `development` branch against the latest rexglue-sdk nightly and
# publishes it as a prerelease, keeping the 10 most recent. The tag is stable
# per dev+sdk combo, so a rerun of the same combo skips without building.
#
# GitHub only fires `schedule` from the default branch, so this file has to be
# on main for the cron to run. It skips quietly while `development` is absent.

on:
  push:
    branches: [development]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: dev-nightly-ci
  cancel-in-progress: true

env:
  SDK_REPO: rexglue/rexglue-sdk
  SDK_NIGHTLY_PREFIX: nightly-
  REBLUE_NIGHTLY_PREFIX: nightly-v
  REBLUE_NIGHTLY_RETENTION: 10
  DEV_BRANCH: development

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      should_build:     ${{ steps.decide.outputs.should_build }}
      dev_sha:          ${{ steps.decide.outputs.dev_sha }}
      dev_short:        ${{ steps.decide.outputs.dev_short }}
      sdk_tag:          ${{ steps.decide.outputs.sdk_tag }}
      sdk_short:        ${{ steps.decide.outputs.sdk_short }}
      version:          ${{ steps.decide.outputs.version }}
      tag_name:         ${{ steps.decide.outputs.tag_name }}
      asset_base:       ${{ steps.decide.outputs.asset_base }}
      prev_nightly_sha: ${{ steps.decide.outputs.prev_nightly_sha }}
    steps:
      - name: Look for the dev branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/branches/${DEV_BRANCH}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::no ${DEV_BRANCH} branch yet; nothing to build"
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout development
        if: steps.branch.outputs.exists == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEV_BRANCH }}
          fetch-depth: 1

      - name: Resolve combo and decide
        id: decide
        if: steps.branch.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/resolve-nightly.sh

  windows:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    uses: ./.github/workflows/_build-windows.yml
    with:
      ref: ${{ needs.resolve.outputs.dev_sha }}
      sdk_tag: ${{ needs.resolve.outputs.sdk_tag }}
      asset_base: ${{ needs.resolve.outputs.asset_base }}
    secrets: inherit

  linux:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    uses: ./.github/workflows/_build-linux.yml
    with:
      ref: ${{ needs.resolve.outputs.dev_sha }}
      sdk_tag: ${{ needs.resolve.outputs.sdk_tag }}
      asset_base: ${{ needs.resolve.outputs.asset_base }}
    secrets: inherit

  macos:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    uses: ./.github/workflows/_build-macos.yml
    with:
      ref: ${{ needs.resolve.outputs.dev_sha }}
      sdk_tag: ${{ needs.resolve.outputs.sdk_tag }}
      asset_base: ${{ needs.resolve.outputs.asset_base }}
    secrets: inherit

  publish:
    needs: [resolve, windows, linux, macos]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development @ ${{ needs.resolve.outputs.dev_short }}
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.dev_sha }}
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Compose release notes
        env:
          DEV_SHA:  ${{ needs.resolve.outputs.dev_sha }}
          PREV_SHA: ${{ needs.resolve.outputs.prev_nightly_sha }}
          SDK_TAG:  ${{ needs.resolve.outputs.sdk_tag }}
        run: bash .github/scripts/compose-nightly-notes.sh

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag_name }}
          name: reblue v${{ needs.resolve.outputs.version }} dev nightly
          body_path: notes.md
          prerelease: true
          target_commitish: ${{ needs.resolve.outputs.dev_sha }}
          files: artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old nightlies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/prune-nightlies.sh
