# Save system tweaks (bodies in src/engine/save/save_hooks.cpp).

# Camp Save entry away from save points (active when bd_save_anywhere).
# Camp_IsSaveAvailable (0x822D7630) scans for an in-range save point gimmick;
# camp's top menu entry builder and color pass both gate the Save row on it.
# Fires after the prologue, before 'bl bdGetGlobalConfig'; on true jumps to the
# function's own 'li r3,1' return path.
[[midasm_hook]]
address = 0x822D7640
name = "bdCampSaveAnywhereHook"
registers = []
after_instruction = false
jump_address_on_true = 0x822D7694
